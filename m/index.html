<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>빈크래프트 상권분석</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#fff;color:#111;-webkit-font-smoothing:antialiased;}
.wm{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.wm::before{content:'빈크래프트 BeanCraft · 빈크래프트 BeanCraft · 빈크래프트 BeanCraft · 빈크래프트 BeanCraft · 빈크래프트 BeanCraft';position:absolute;top:-50%;left:-50%;width:200%;height:200%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:rgba(26,54,93,.05);letter-spacing:6px;white-space:nowrap;transform:rotate(-35deg)}
.hd{background:linear-gradient(135deg,#1a365d,#0f2647);color:#fff;padding:28px 22px}
.hd .brand{font-size:.74rem;font-weight:800;letter-spacing:.06em;opacity:.8}
.hd .area{font-size:1.4rem;font-weight:800;margin-top:6px}
.hd .sub{font-size:.84rem;color:#cbd5e0;margin-top:4px}
.bd{max-width:560px;margin:0 auto;padding:18px 16px 48px;position:relative;z-index:6}
.purpose{border:1.5px solid #1a365d;border-radius:12px;padding:15px 17px;font-size:.86rem;line-height:1.75;color:#222;margin-bottom:10px}.purpose b{color:#1a365d}
.disc{font-size:.74rem;color:#8a93a0;line-height:1.6;margin:0 2px 8px}
.collected{font-size:.8rem;color:#1a365d;font-weight:600;margin:0 2px 10px}
.notice{background:#f4f7fb;border:1px solid #dde6f1;border-radius:10px;padding:11px 14px;font-size:.78rem;color:#3b4a5e;line-height:1.6;margin:0 2px 16px;display:flex;gap:7px;align-items:flex-start}.notice .ic{flex-shrink:0}
.hbtn{display:inline-block;margin-bottom:12px;background:#fff;color:#1a365d;border:1.5px solid #1a365d;font-weight:700;padding:10px 22px;border-radius:999px;text-decoration:none;font-size:.88rem}
.ask{font-size:.92rem;font-weight:700;color:#1a365d;margin-bottom:10px}
.midcta{border:1.5px solid #1a365d;border-radius:14px;padding:20px 18px;text-align:center;margin:4px 2px 18px;background:#f4f7fb}
.midcta .ask{font-size:1.02rem;font-weight:800;color:#1a365d;margin-bottom:14px}
.cta2{display:block;width:100%;background:#1a365d;color:#fff;font-weight:800;padding:14px;border-radius:10px;text-decoration:none;font-size:.98rem;margin-bottom:10px}
.cta2.have{background:#fff;color:#1a365d;border:1.5px solid #1a365d;margin-bottom:0}
.oc{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.oct{padding:11px 15px;font-size:.95rem;border-bottom:1px solid #f0f2f4}.oct.on{font-weight:800;color:#111}.oct.off{font-weight:600;color:#9aa6b3}
.oi{width:100%;display:block}
.olock{position:relative;max-height:230px;overflow:hidden}
.olock .oi{filter:blur(4px);transform:scale(1.05)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,30,50,.42)}
.ovmsg{color:#fff;font-weight:700;font-size:.95rem;text-align:center;line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ovbtn{background:#fff;color:#1a365d;font-weight:800;font-size:.9rem;padding:10px 20px;border-radius:999px;text-decoration:none}
.foot{margin-top:8px;border-top:1px dashed #d3d9e0;padding-top:20px;text-align:center}
.foot p{font-size:.85rem;color:#445;line-height:1.7;margin-bottom:14px}.foot .site{color:#1a365d;font-weight:700}
.cta{display:inline-block;background:#1a365d;color:#fff;font-weight:800;padding:13px 26px;border-radius:999px;text-decoration:none;font-size:.95rem}
.cr{position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#a0aec0;padding:9px;text-align:center;font-size:.7rem;z-index:10}.cr b{color:#4a7fbf}
.state{text-align:center;color:#9aa6b3;padding:80px 24px;font-size:.95rem;line-height:1.7}
body{padding-bottom:46px}
</style>
</head>
<body>
<div class="wm" aria-hidden="true"></div>
<div id="app"><div class="state">불러오는 중…</div></div>
<div class="cr"><b>© 2026 BEANCRAFT</b> · 본 자료는 빈크래프트의 저작물입니다. 무단 복제·재배포를 금합니다.</div>

<script>
var FB={apiKey:"AIzaSyBRrxkXnyGd3HKXFKEUB2o15sY8U2N2Mic",authDomain:"beancraft-sales-team.firebaseapp.com",databaseURL:"https://beancraft-sales-team-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"beancraft-sales-team",storageBucket:"beancraft-sales-team.firebasestorage.app",messagingSenderId:"803745881200",appId:"1:803745881200:web:fb430162f761e3ecdba8b5"};
var PUB_REF='marketing/published';
var CONSULT='https://docs.google.com/forms/d/e/1FAIpQLSeRIOxxWOuf-kkhjSsLe5ctcw7GO8_jt5I4rM9sS3CDtJpP5g/viewform';
// 동일한 상담 폼 + '상담 내용' 칸에 구분 표시를 미리 채워 보냄 → 받는 사람이 어느 버튼인지 구분 가능
var CONSULT_FIND=CONSULT+'?usp=pp_url&entry.740000146='+encodeURIComponent('[매물을 구해주세요] ');
var CONSULT_HAVE=CONSULT+'?usp=pp_url&entry.740000146='+encodeURIComponent('[매물은 구했어요] ');
var DEMO=/[?&]demo=1/.test(location.search);
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function render(item){
  if(!item){document.getElementById('app').innerHTML='<div class="state">자료를 찾을 수 없습니다.<br>링크를 다시 확인해 주세요.</div>';return;}
  var arr=(item.cards||[]).map(function(c){
    var t=esc(c.title||'정보 카드');
    if(c.revealed){
      return '<div class="oc"><div class="oct on">'+t+'</div><img class="oi" loading="lazy" src="'+c.file+'"></div>';
    }
    return '<div class="oc"><div class="oct off">'+t+'</div><div class="olock"><img class="oi" loading="lazy" src="'+c.file+'"><div class="ov"><div class="ovmsg">이 정보는 카페 창업자에게만<br>제공되는 서비스입니다</div></div></div></div>';
  });
  // 카드 이미지 사이(중간)에 상담 유도 블록 + 두 버튼 삽입
  var midcta='<div class="midcta"><div class="ask">준비 중인 상권이 있으신가요?</div>'+
    '<a class="cta2" href="'+CONSULT_FIND+'" target="_blank" rel="noopener">매물 구해주세요</a>'+
    '<a class="cta2 have" href="'+CONSULT_HAVE+'" target="_blank" rel="noopener">매물은 구했어요</a></div>';
  if(arr.length){ arr.splice(Math.min(1,arr.length),0,midcta); }   // 첫 카드 바로 뒤(잘 보이게)
  var cards=arr.join('');
  if(!item.cards||!item.cards.length)cards='<div class="state">등록된 카드가 없습니다.</div>';
  var col=esc(item.collectedAt||'');
  var dateLine=col?'<div class="collected">데이터 수집일 · <b>'+col+'</b></div>':'';
  document.getElementById('app').innerHTML=
   '<div class="hd"><div class="brand">BEANCRAFT · 카페 창업</div><div class="area">'+esc(item.title||'상권분석 리포트')+'</div><div class="sub">빈크래프트 상권분석 리포트</div></div>'+
   '<div class="bd">'+
   '<div class="purpose">이 자료는 빈크래프트가 직접 개발한 상권분석 프로그램으로 분석한 실제 데이터입니다. 저희는 <b>상권분석을 파는 회사가 아니라, 매물부터 오픈까지 함께하는 카페 창업 회사</b>예요. 상권분석은 창업을 준비하는 과정의 일부입니다.<br><br>그래서 이 자료도 전체 중 일부만 공개해 두었어요. 정보를 팔려는 게 아니라, 저희가 창업을 도울 때 <b>이런 데이터까지 들여다본다</b>는 걸 보여드리고 싶었습니다. 모든 정보는 카페 창업자를 위해 준비해 두었습니다.</div>'+
   '<div class="disc">※ 분석 데이터는 실시간으로 수집되지만, 본 자료는 <b>수집된 시점 기준</b> 정보입니다. 전체 분석은 카페 창업 상담 시에만 제공됩니다.</div>'+
   dateLine+
   '<div class="notice"><span>공개된 정보는 <b>영상 속에 첨부한 정보</b>만 보여드리고 있습니다.</span></div>'+
   cards+
   '<div class="foot"><a class="hbtn" href="https://beancraft.co.kr" target="_blank" rel="noopener">빈크래프트 홈페이지 바로가기</a><p><b>빈크래프트는 프랜차이즈 회사가 아닙니다.</b><br>개인 카페를 만들어 주는 회사입니다.</p></div>'+
   '</div>';
}

function findItem(data,id){
  if(!data||!data.categories)return null;
  var cats=data.categories,first=null;
  for(var k in cats){var c=cats[k];var items=c.items||[];for(var j in items){var it=items[j];if(it&&(it.type==='market'||it.cards)){if(!first)first=it;if(it.id===id)return it;}}}
  return id?null:first;  // id 없으면 첫 상권분석
}

var id=location.hash.replace('#','');
if(DEMO){
  // 로컬 테스트용 샘플 (실제 배포본 형태와 동일)
  var img='/hub/content/market-analysis/gangnam-full.jpg';
  render({title:'강남역 상권분석',collectedAt:'2026-06-10',cards:[
    {title:'상권 분석 리포트',file:img,revealed:true},
    {title:'상권 변화 추이',file:img,revealed:false},
    {title:'유동인구',file:img,revealed:false}
  ]});
}else{
  try{
    firebase.initializeApp(FB);
    firebase.database().ref(PUB_REF).once('value').then(function(s){
      render(findItem(s.val(),id));
    }).catch(function(){
      document.getElementById('app').innerHTML='<div class="state">자료를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
    });
  }catch(e){document.getElementById('app').innerHTML='<div class="state">오류가 발생했습니다.</div>';}
}
</script>
</body>
</html>

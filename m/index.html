/* ===== 자료 보호 (우클릭·드래그·복사·저장·인쇄·소스보기 차단) =====
   완전 차단은 불가능하므로(화면 캡처는 OS 기능) 워터마크와 함께 다층 억제용. */
(function(){
  var d=document;
  d.addEventListener('contextmenu',function(e){e.preventDefault();});
  d.addEventListener('dragstart',function(e){e.preventDefault();});
  d.addEventListener('selectstart',function(e){var a=d.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;e.preventDefault();});
  d.addEventListener('copy',function(e){var a=d.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;e.preventDefault();if(e.clipboardData)e.clipboardData.setData('text/plain','© BEANCRAFT 저작물 — 무단 복제·공유 금지');});
  d.addEventListener('cut',function(e){e.preventDefault();});
  d.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(k==='u'||k==='s'||k==='p'||k==='a')){
      if(k==='a'&&d.activeElement&&(d.activeElement.tagName==='INPUT'||d.activeElement.tagName==='TEXTAREA'))return;
      e.preventDefault();e.stopPropagation();
    }
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='i'||k==='j'||k==='c'||k==='s'))e.preventDefault();
    if(e.keyCode===123)e.preventDefault();   // F12
  });
})();

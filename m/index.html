.watermark-text-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;overflow:hidden}
.watermark-text-overlay::before{content:'빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft  ·  빈크래프트 BeanCraft';position:absolute;top:-50%;left:-50%;width:200%;height:200%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:rgba(43,108,176,0.07);letter-spacing:6px;white-space:nowrap;transform:rotate(-35deg)}
.hd{background:linear-gradient(135deg,#1a365d,#0f2647);color:#fff;padding:28px 22px}
.hd .brand{font-size:.74rem;font-weight:800;letter-spacing:.06em;opacity:.8}
.hd .area{font-size:1.4rem;font-weight:800;margin-top:6px}
.hd .sub{font-size:.84rem;color:#cbd5e0;margin-top:4px}
.bd{max-width:560px;margin:0 auto;padding:18px 16px 48px;position:relative;z-index:6}
.purpose{border:1.5px solid #1a365d;border-radius:12px;padding:15px 17px;font-size:.86rem;line-height:1.75;color:#222;margin-bottom:10px}.purpose b{color:#1a365d}
.disc{font-size:.74rem;color:#8a93a0;line-height:1.6;margin:0 2px 8px}
.collected{font-size:.8rem;color:#1a365d;font-weight:600;margin:0 2px 10px}
.notice{background:#f4f7fb;border:1px solid #dde6f1;border-radius:10px;padding:11px 14px;font-size:.78rem;color:#3b4a5e;line-height:1.6;margin:0 2px 16px;display:flex;gap:7px;align-items:flex-start}.notice .ic{flex-shrink:0}
.hbtn{display:inline-block;margin-bottom:12px;background:#fff;color:#1a365d;border:1.5px solid #1a365d;font-weight:700;padding:10px 22px;border-radius:999px;text-decoration:none;font-size:.88rem}
.ask{font-size:.92rem;font-weight:700;color:#1a365d;margin-bottom:10px}
.midcta{text-align:center;margin:24px 2px 26px}
.midcta .ask{font-size:1.05rem;font-weight:800;color:#1a365d;margin-bottom:12px}
.ctarow{display:flex;gap:10px;max-width:400px;margin:0 auto}
.cta2{flex:1;text-align:center;font-weight:700;font-size:.96rem;padding:13px 12px;border-radius:10px;cursor:pointer;font-family:inherit;text-decoration:none;border:1.5px solid #1a365d;transition:opacity .15s}
.cta2:hover{opacity:.9}
.cta2.find{background:#1a365d;color:#fff}
.cta2.have{background:#fff;color:#1a365d}
.cmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10010;display:none;align-items:center;justify-content:center;padding:16px}
.cmodal.open{display:flex}
.cbox{background:#fff;border-radius:16px;width:440px;max-width:calc(100vw - 32px);height:800px;max-height:calc(100vh - 56px);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 44px rgba(0,0,0,.35)}
.chead{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.chead b{font-size:1rem;font-weight:800}
.cclose{background:none;border:0;color:#fff;font-size:1.1rem;cursor:pointer;padding:4px 8px;line-height:1}
.cbox iframe{flex:1;width:100%;border:0;background:#fff}
.oc{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.oct{padding:11px 15px;font-size:.95rem;border-bottom:1px solid #f0f2f4}.oct.on{font-weight:800;color:#111}.oct.off{font-weight:600;color:#9aa6b3}
.oi{width:100%;display:block;-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none}
.iw{position:relative}
.ish{position:absolute;inset:0}
.olock{position:relative;max-height:230px;overflow:hidden}
.olock .oi{filter:blur(4px);transform:scale(1.05)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,30,50,.42)}
.ovmsg{color:#fff;font-weight:700;font-size:.95rem;text-align:center;line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ovbtn{background:#fff;color:#1a365d;font-weight:800;font-size:.9rem;padding:10px 20px;border-radius:999px;text-decoration:none}
.foot{margin-top:8px;border-top:1px dashed #d3d9e0;padding-top:20px;text-align:center}

      e.preventDefault();e.stopPropagation();
    }
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='i'||k==='j'||k==='c'||k==='s'))e.preventDefault();
    if(e.keyCode===123)e.preventDefault();   // F12
  });
})();

var id=location.hash.replace('#','');
if(DEMO){
  // 로컬 테스트용 샘플 (실제 배포본 형태와 동일)
  var img='/hub/content/market-analysis/gangnam-full.jpg';
  render({title:'강남역 상권분석',collectedAt:'2026-06-10',cards:[
    {title:'상권 분석 리포트',file:img,revealed:true},
    {title:'상권 변화 추이',file:img,revealed:false},
    {title:'유동인구',file:img,revealed:false}
  ]});
}else if(!id){
  document.getElementById('app').innerHTML='<div class="state">링크를 다시 확인해 주세요.<br>(자료 주소가 올바르지 않습니다)</div>';
}else{
  try{
    firebase.initializeApp(FB);
    // 받은 링크의 상권 1개만 읽음 (published 통째 읽기는 규칙으로 차단됨 → 링크 하나로 전체 덤프 불가)
    firebase.database().ref(PUB_REF+'/'+id).once('value').then(function(s){
      render(s.val());
    }).catch(function(){
      document.getElementById('app').innerHTML='<div class="state">자료를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
    });
  }catch(e){document.getElementById('app').innerHTML='<div class="state">오류가 발생했습니다.</div>';}
}
